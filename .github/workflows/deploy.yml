name: Build and Deploy CV

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          # THIS IS THE MAGIC FIX: Forces the modern XeLaTeX engine
          latexmk_use_xelatex: true

      - name: Upload PDF for Preview (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cv-preview
          path: resume.pdf

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::594593752580:role/GitHubActions-CVSync-Role
          aws-region: eu-north-1

      - name: Upload PDF to S3
        run: |
          aws s3 cp resume.pdf s3://aws-buckettest-first/resume.pdf \
            --content-type "application/pdf"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2SBL3HXSCR988 \
            --paths "/resume.pdf"